site_name: bldc-foc-sim Theory Documentation
site_description: Educational material for three-phase brushless motor FOC / EPS simulation

# English site (default). For the Japanese site, build with: mkdocs build -f mkdocs.ja.yml
docs_dir: docs_en
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      # Generate GitHub-compatible slugs that preserve heading text. The default
      # slugify strips non-ASCII characters (relevant for the Japanese site); we
      # keep the same configuration here for parity between the two language builds.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Theory:
    - Motor Model (Electrical & Mechanical Equations): theory/motor-model.md
    - Coordinate Transforms (Clarke / Park): theory/coordinate-transform.md
    - Field-Oriented Control (FOC): theory/foc.md
    - PI Gain Design (Pole Placement): theory/pi-tuning.md
    - PWM Inverter & Midpoint Modulation: theory/pwm-inverter.md
    - Sensorless Control: theory/sensorless.md
    - Electric Power Steering (EPS): theory/eps.md
    - Functional Safety (HARA / ISO 26262): theory/functional-safety.md
    - Waveform Difference Analysis (Type A/B & Sensorless): theory/waveform-analysis.md
  - Derivations: derivations.md
  - Glossary: glossary.md
  - References: references.md
