name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 全モデルは同じターゲット名 (BrushlessDCMotor) を使うため 1 つの CMake ツリーに
# まとめられない。モデルごとに configure → build → ctest をマトリクスで回す。
jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.model }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        model:
          - 01-foc-ideal-voltage
          - 02-foc-pwm-drive
          - 03-foc-pwm-eps
          - 04-foc-pwm-sensorless
          - 05-foc-pwm-eps-sensorless

    steps:
      - uses: actions/checkout@v4

      # Linux はシステムの Eigen を使う。Windows は CMake の FetchContent
      # フォールバック (gitlab から 3.4.0 を取得) が自動で走る。
      - name: Install Eigen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      # 高警告レベル + 警告のエラー化を品質ゲートとして有効化する。
      - name: Configure
        run: >-
          cmake -S "${{ matrix.model }}" -B "${{ matrix.model }}/build"
          -DCMAKE_BUILD_TYPE=Release
          -DBLDC_ENABLE_WARNINGS=ON
          -DBLDC_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build "${{ matrix.model }}/build" --config Release

      - name: Test (ctest)
        run: ctest --test-dir "${{ matrix.model }}/build" -C Release --output-on-failure

  # モデル間で同一であるべき共有ファイル (座標変換・CSV 照合) のドリフトを検出する。
  consistency:
    name: shared-file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared files are identical across models
        run: bash tests/check_shared_files.sh

  # コードスタイル (.clang-format) の逸脱を検査する。ローカルと同一バージョンに固定。
  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install clang-format
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          files=$(find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.hpp' \) -print)
          echo "$files"
          clang-format --dry-run --Werror $files

  # ASan/UBSan で未定義動作・メモリ不正を検出する (代表としてモデル 02)。
  sanitizers:
    name: ASan+UBSan (02-foc-pwm-drive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Configure (sanitized Debug)
        run: >-
          cmake -S 02-foc-pwm-drive -B 02-foc-pwm-drive/build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build 02-foc-pwm-drive/build-san
      - name: Test (ctest)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir 02-foc-pwm-drive/build-san --output-on-failure
